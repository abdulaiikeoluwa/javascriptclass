<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Words-censor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: gray;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: black;
      backdrop-filter: blur(12px);
      padding: 30px;
      box-shadow: purple;
      color: red;
    }

    h1 {
      color: red;
      text-align: center;
      margin-bottom: 20px;
    }

    textarea {
      color: red;
      width: 100%;
      height: 100px;
      padding: 15px;
      border: none;
      outline: none;
      border-radius: 12px;
      resize: none;
      font-size: 16px;
    }

    button {
      width: 50%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #00c896;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    button:active {
      transform: translateY(2px);
    }

    .result {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 12px;
      min-height: 80px;
    }

    .result h3 {
      margin-bottom: 10px;
    }

    .output {
      color: #fff;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Word Sensor</h1>
    <h2>Filtered words: 'rude' 'arrogant' 'selfish' 'lazy'</h2>
    <textarea
      id="vulgarwords">the rude, and selfish employeee was too lazy, and his arrogant attitude annoyed everyone </textarea>
    <button onclick="filteredWords()">Filter Sentence</button>
    <div class="result">
      <h3>filterWords</h3>
      <p id="output" class="output"></p>
    </div>
  </div>
</body>
<script>
  let input = document.getElementById('vulgarwords')

  function filteredWords() {
    let vulgarinputs = input.value

    vulgarinputs = vulgarinputs.replaceAll('rude', 'r*de')
    vulgarinputs = vulgarinputs.replaceAll('arrogant', 'a*o*a*t')
    vulgarinputs = vulgarinputs.replaceAll('selfish', 's*lf*sh')
    vulgarinputs = vulgarinputs.replaceAll('lazy', 'l*zy')

    output.innerHTML = vulgarinputs;
  }
</script>

</html>
