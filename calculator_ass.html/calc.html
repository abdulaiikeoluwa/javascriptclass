<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: #ffffff;
    color: #1f2a37;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  /* Calculator sits in the top-left; everything else stays white */
  .calculator {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 280px;
    max-width: calc(100% - 32px);
    padding: 14px;
    background: #1f2a37;
    border-radius: 14px;
  }
  .display {
    background: #eef2f6;
    color: #1f2a37;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    text-align: right;
    min-height: 72px;
    overflow: hidden;
  }
  .history { font-size: 13px; color: #5b6776; min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .current { font-size: 32px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow-x: auto; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button {
    font: inherit;
    font-size: 18px;
    padding: 14px 0;
    border: 0;
    border-radius: 8px;
    background: #ffffff;
    color: #1f2a37;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid #ffbf47; outline-offset: 2px; }
  button.op { background: #2f6fed; color: #ffffff; }
  button.clear { background: #e5484d; color: #ffffff; }
  button.wide { grid-column: span 2; }
</style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display" aria-live="polite">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="keys">
      <button class="clear" data-action="clear">C</button>
      <button data-action="back" aria-label="Backspace">&#9003;</button>
      <button data-action="percent">%</button>
      <button class="op" data-op="/">&divide;</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*">&times;</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-">&minus;</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="wide" data-num="0">0</button>
      <button data-action="dot">.</button>
      <button class="op" data-action="equals">=</button>
    </div>
  </main>

<script>
  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');
  const symbols = { '+': '+', '-': '\u2212', '*': '\u00d7', '/': '\u00f7' };

  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;

  function compute(a, b, op) {
    a = parseFloat(a); b = parseFloat(b);
    let r;
    if (op === '+') r = a + b;
    else if (op === '-') r = a - b;
    else if (op === '*') r = a * b;
    else if (op === '/') { if (b === 0) return 'Cannot divide by 0'; r = a / b; }
    return String(parseFloat(r.toPrecision(12)));
  }

  function render() {
    currentEl.textContent = current;
    historyEl.textContent = operator ? previous + ' ' + symbols[operator] : '';
  }

  function inputNumber(n) {
    if (justEvaluated || isNaN(current)) { current = '0'; justEvaluated = false; }
    current = current === '0' ? n : current + n;
    render();
  }

  function inputDot() {
    if (justEvaluated || isNaN(current)) { current = '0'; justEvaluated = false; }
    if (!current.includes('.')) current += '.';
    render();
  }

  function chooseOperator(op) {
    if (isNaN(current)) return;
    if (operator && !justEvaluated) {
      current = compute(previous, current, operator);
      if (isNaN(current)) { operator = null; previous = null; render(); return; }
    }
    previous = current;
    operator = op;
    justEvaluated = true;
    render();
  }

  function equals() {
    if (!operator || isNaN(current)) return;
    current = compute(previous, current, operator);
    operator = null;
    previous = null;
    justEvaluated = true;
    render();
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    justEvaluated = false;
    render();
  }

  function backspace() {
    if (justEvaluated || isNaN(current)) return;
    current = current.length > 1 ? current.slice(0, -1) : '0';
    render();
  }

  function percent() {
    if (isNaN(current)) return;
    current = String(parseFloat((parseFloat(current) / 100).toPrecision(12)));
    render();
  }

  document.querySelector('.keys').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.num !== undefined) inputNumber(b.dataset.num);
    else if (b.dataset.op) chooseOperator(b.dataset.op);
    else {
      const a = b.dataset.action;
      if (a === 'clear') clearAll();
      else if (a === 'back') backspace();
      else if (a === 'dot') inputDot();
      else if (a === 'percent') percent();
      else if (a === 'equals') equals();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (/^[0-9]$/.test(e.key)) inputNumber(e.key);
    else if (e.key === '.') inputDot();
    else if ('+-*/'.includes(e.key)) chooseOperator(e.key);
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape') clearAll();
  });

  render();
</script>
</body>
</html>
